<!DOCTYPE html>
<html>
<head>
  <title>RealConnect Session Authentication Test</title>
</head>
<body>
  <h2>RealConnect Session Authentication Test</h2>

  <button id="testButton">Test Authenticated Session</button>

  <pre id="result"></pre>

  <script>
    document.getElementById("testButton").addEventListener("click", async () => {
      const result = document.getElementById("result");

      try {
        const response = await fetch("/api/test-session", {
          method: "GET",
          headers: {
            "Authorization": "Bearer 405bf7adfcb94c942fe4cd22204c0dda6b2986744b867bb52d6d35033f92bba2"
          }
        });

        const text = await response.text();

        result.textContent =
          "HTTP Status: " + response.status + "\n\n" + text;

      } catch (error) {
        result.textContent = "Request error: " + error;
      }
    });
  </script>
</body>
</html>
